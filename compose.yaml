services:
  readest-backend:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      PUBLIC_ANON_KEY: ${PUBLIC_ANON_KEY:-readest-public-anon-key}
      DATA_DIR: /app/data
      DATABASE_DSN: /app/data/readest.db
      STORAGE_DIR: /app/data/objects
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      SIGNED_URL_TTL: ${SIGNED_URL_TTL:-30m}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-524288000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-2097152}
      HTTP_IO_TIMEOUT: ${HTTP_IO_TIMEOUT:-30m}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      AUTO_CONFIRM_EMAIL: ${AUTO_CONFIRM_EMAIL:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ALLOWED_REDIRECT_URLS: ${ALLOWED_REDIRECT_URLS:-http://localhost:3000,readest://auth-callback}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - readest-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

volumes:
  readest-data:
