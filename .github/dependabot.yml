version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
    open-pull-requests-limit: 5
